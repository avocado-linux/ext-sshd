# Keys shipped with var_files keep the build host's owner and modes (0664 under
# umask 002), which StrictModes rejects. Make them root's and drop group/world
# write; ~ keeps key files at 0644 rather than marking them executable.
d /var/lib/ssh/authorized_keys.d 0755 root root -
Z /var/lib/ssh/authorized_keys.d ~0755 root root -
